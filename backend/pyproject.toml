[project]
name = "galeria"
version = "0.1.0"
description = "Semantic photo & video search with multilingual CLIP and FAISS"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sentence-transformers>=3.0",
    "torch>=2.4",  # direct, so [tool.uv.sources] can point Linux at the CPU-only index
    "faiss-cpu>=1.8",
    "av>=12.0",
    "pillow>=10.4",
    "numpy>=1.26",
    "typer>=0.12",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
]

[project.scripts]
galeria = "galeria.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["galeria"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# On Linux (the Docker image) take torch from PyTorch's CPU-only index: the default PyPI wheel
# pulls in several GB of CUDA libraries the container never uses. macOS keeps the PyPI wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
