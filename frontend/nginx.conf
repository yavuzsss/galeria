server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # One origin for the browser: the UI and the API are both served from here, so no CORS.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Stream video bytes straight through; nginx forwards Range headers, so seeking works.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Vite puts a content hash in every asset name, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app reads ?q= from the URL; any other path falls back to the single page.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
